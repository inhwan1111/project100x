name: PROJECT 100X market data
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'
permissions:
  contents: write
concurrency:
  group: project100x-market-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch and validate QQQ
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: node scripts/collect-market-data.cjs
      - name: Commit validated public market data if changed
        run: |
          if [ ! -f market-data/QQQ-daily.csv ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-data/QQQ-daily.csv market-data/status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update validated QQQ daily data"
          git push
