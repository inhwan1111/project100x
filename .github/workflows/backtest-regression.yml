name: Backtest regression verification
on:
  push:
    branches:
      - test/backtest-regression-20261030
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic backtest tests
        run: |
          node tests/backtest-regression.test.js
          node tests/qqq-integration.test.js
          node tests/market-data-v09.test.js
